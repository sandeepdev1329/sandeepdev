trigger:
  branches:
    include:
      - main  # Trigger pipeline on push to main branch
 
pool:
  vmImage: 'windows-latest'  # Use a Windows agent (can be changed to 'ubuntu-latest' or 'macOS-latest')
 
stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: Build
    displayName: 'Build Job'
    steps:
    - task: UseNode@2
      inputs:
        version: '18.x'  # Adjust the Node.js version if needed
      displayName: 'Install Node.js'
 
    - script: npm install
      displayName: 'Install dependencies'
 
    - script: npm run build
      displayName: 'Build the project'
 
    - script: npm test
      displayName: 'Run tests'
 
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'dist'  # Adjust the path to your build output
        artifactName: 'drop'
      displayName: 'Publish Build Artifacts'
